services:
  ecrew-sync:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: ecrew-sync:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ECREW_DB_FILE: /data/roster.json
      ECREW_COOKIE_FILE: /data/session_state.json
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
