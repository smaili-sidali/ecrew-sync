[project]
name = "ecrew-sync"
version = "2.5.0"
description = "Self-hosted Air Algérie eCrew roster: PWA, JSON API and .ics export"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dotenv>=1.0",
    "ics>=0.7.2",
    "typer>=0.12",
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx>=0.27",   # required by fastapi.testclient
    "ruff>=0.6",
    "mypy>=1.8",
]

[project.scripts]
ecrew-sync = "cli.main:app"

[tool.setuptools]
packages = ["backend", "server", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # starlette pins httpx<1 and warns about its own TestClient shim.
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # long lines are handled by the formatter
    "B008",    # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers on purpose, to pin down behaviour.
"tests/*" = ["SLF001"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
# Be pragmatic: flag real type errors, not stylistic variance. Untyped third-party
# stubs (ics, apscheduler) would otherwise drown the signal.
disallow_untyped_defs = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["backend", "server", "cli"]

[[tool.mypy.overrides]]
# The ics library ships no type information.
module = ["ics.*", "apscheduler.*", "dotenv.*"]
ignore_missing_imports = true

