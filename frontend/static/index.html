<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <meta name="theme-color" content="#0b1f3a">
    <meta name="description" content="Your Air Algérie roster at a glance">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="eCrew">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="stylesheet" href="/style.css">
    <title>eCrew · My Roster</title>
</head>
<body>

<header class="hero">
    <div class="hero-top">
        <div class="brand">
            <div class="brand-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>
                </svg>
            </div>
            <div class="brand-text">
                <h1>eCrew</h1>
                <span>My Roster</span>
            </div>
        </div>
        <button id="dark-toggle" class="icon-btn" title="Toggle dark mode" aria-label="Toggle dark mode">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
    </div>
    <p class="hero-sub">Welcome back ✈</p>
    <div class="hero-actions">
        <button id="sync-btn" class="btn btn-light">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
            <span id="sync-btn-label">Sync now</span>
        </button>
        <button id="export-btn" class="btn btn-ghost">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
            Calendar
        </button>
    </div>
</header>

<main>
    <div class="status-pill-row">
        <span id="sync-status" class="status-pill"><span class="dot"></span> idle</span>
        <span class="status-pill muted">Updated <span id="synced-at">never</span></span>
    </div>

    <div class="month-nav">
        <button id="prev-month" class="icon-btn round" aria-label="Previous month">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                 stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="month-label" id="month-label">—</div>
        <button id="next-month" class="icon-btn round" aria-label="Next month">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                 stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <input type="month" id="month-filter" hidden>
    </div>

    <section class="stats" id="stats">
        <div class="stat-card">
            <div class="stat-num" id="stat-flights">—</div>
            <div class="stat-label">Flights</div>
        </div>
        <div class="stat-card">
            <div class="stat-num" id="stat-off">—</div>
            <div class="stat-label">Days off</div>
        </div>
        <div class="stat-card">
            <div class="stat-num" id="stat-standby">—</div>
            <div class="stat-label">Standby</div>
        </div>
    </section>

    <div id="loading" class="loading-state">
        <div class="spinner"></div>
        <p>Loading roster…</p>
    </div>

    <div id="error" class="error-banner hidden"></div>

    <div id="empty" class="empty-state hidden">
        <div class="empty-icon">🗓</div>
        <h3>No duties this month</h3>
        <p>Nothing scheduled. Enjoy the free time!</p>
    </div>

    <section id="days" class="days"></section>
</main>

<footer>
    <p>eCrew Sync · local &amp; private · <span id="footer-version">v0.2</span></p>
</footer>

<script src="/app.js"></script>
</body>
</html>
