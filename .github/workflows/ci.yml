name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check backend server cli tests

      - name: Type check
        run: mypy

      - name: Test
        run: pytest -q

      - name: Verify the secret-bearing files are ignored
        # A committed roster.json or session_state.json would publish real duty
        # data and a live session UUID to a public repo.
        run: |
          for f in roster.json session_state.json .env; do
            if git check-ignore -q "$f"; then
              echo "ok: $f is gitignored"
            else
              echo "::error::$f is NOT gitignored"; exit 1
            fi
          done
