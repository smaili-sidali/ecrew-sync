<!DOCTYPE html><html lang=en><head><meta charset=iso-8859-1><meta name=description content="eCrew AH"><title>eCrew</title></head><body>

<script type="text/javascript">
// Trimmed from the live portal page (https://ecrew.airalgerie.dz/eCrew, captured
// 2026-10-03) and from the HomeIndex body in ecrew.airalgerie.dz.har. Only the
// parts that matter for the regression are kept.
//
// The portal ships its own client-side message templates and matches login
// responses against long hex digests, so any conflict detection that greps a page
// for that wording reports a conflict on every successful response. Note that no
// JSON error marker appears anywhere in a page: that only ever shows up in the
// portal's JSON error payload.
var MESSAGES = {
  another_session: "Another active session",
  terminated: "Session has now been terminated",
  invalid_credentials: "Invalid credentials"
};
function PostLogin(responsedata) {
  if (responsedata.includes("f8988e0c5cb55a2ce4071ab98182c61a7bfe716ce497d74ad03a7cf6fd14350f")) {
    alert(MESSAGES.another_session + " is currently open under your account.");
    return false;
  }
  if (responsedata.includes("892ebb3364ed86229a12fd48d2a95ece31bd9019bdc66e6b9f146706991dffdf")) {
    alert(MESSAGES.terminated + " for you.");
    return false;
  }
  if (responsedata.toLowerCase().indexOf(MESSAGES.invalid_credentials.toLowerCase()) === 0) {
    return false;
  }
  return true;
}
var InitialSchedulerEvents = [];
</script>
